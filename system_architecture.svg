<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 810" width="640" height="810" role="img" aria-label="System Architecture Flowchart">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22d3ee"/>
    </marker>
  </defs>

  <!-- Background Card -->
  <rect width="640" height="810" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <text x="320" y="36" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="2.2" fill="#94a3b8">SPECTRUM SENSING PROCESSING PIPELINE</text>

  <!-- Step 1: Signal Generation -->
  <rect x="70" y="56" width="500" height="72" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
  <circle cx="96" cy="92" r="5" fill="#38bdf8" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="320" y="86" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">1. Signal Generation</text>
  <text x="320" y="111" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">QPSK Complex Baseband  •  256 Samples/Obs  •  14,000 Observations</text>

  <!-- Flow 1 -> 2 -->
  <line x1="320" y1="128" x2="320" y2="162" stroke="#38bdf8" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrowBlue)">
    <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.1s" repeatCount="indefinite"/>
  </line>

  <!-- Step 2: Channel Modelling -->
  <rect x="70" y="166" width="500" height="72" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="1.8"/>
  <circle cx="96" cy="202" r="5" fill="#818cf8" filter="url(#glow)">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="320" y="196" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">2. Channel Modelling</text>
  <text x="320" y="221" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">AWGN (-20 to +10 dB)  •  Rayleigh Fading  •  Noise Uncertainty (0–3 dB)</text>

  <!-- Flow 2 -> 3 -->
  <line x1="320" y1="238" x2="320" y2="272" stroke="#818cf8" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrowIndigo)">
    <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.1s" repeatCount="indefinite"/>
  </line>

  <!-- Step 3: Feature Extraction & Split -->
  <rect x="70" y="276" width="500" height="72" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="1.8"/>
  <circle cx="96" cy="312" r="5" fill="#a78bfa" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="320" y="306" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">3. Feature Extraction &amp; Data Split</text>
  <text x="320" y="331" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">Statistical &amp; Spectral Features  •  Raw I/Q  •  Stratified Train / Val / Test</text>

  <!-- Flow 3 -> 4 -->
  <line x1="320" y1="348" x2="320" y2="380" stroke="#a78bfa" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrowPurple)">
    <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.1s" repeatCount="indefinite"/>
  </line>

  <!-- Step 4: Parallel Spectrum Sensing Models Container -->
  <rect x="28" y="384" width="584" height="196" rx="14" fill="#0b1220" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="320" y="406" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" fill="#cbd5e1">4. SPECTRUM SENSING DETECTORS</text>

  <!-- 4a: Energy Detection -->
  <rect x="46" y="420" width="262" height="66" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="177" y="449" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#fef3c7">Energy Detection</text>
  <text x="177" y="471" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#fcd34d">Threshold Baseline</text>

  <!-- 4b: Logistic Regression -->
  <rect x="332" y="420" width="262" height="66" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.6"/>
  <text x="463" y="449" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#d1fae5">Logistic Regression</text>
  <text x="463" y="471" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#6ee7b7">Linear Feature Classifier</text>

  <!-- 4c: Random Forest -->
  <rect x="46" y="498" width="262" height="66" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.6"/>
  <text x="177" y="527" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#dcfce7">Random Forest</text>
  <text x="177" y="549" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#86efac">Ensemble Decision Trees</text>

  <!-- 4d: 1D-CNN -->
  <rect x="332" y="498" width="262" height="66" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.6"/>
  <text x="463" y="527" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#fce7f3">1D-CNN</text>
  <text x="463" y="549" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#f9a8d4">Deep Learning (Raw I/Q)</text>

  <!-- Flow 4 -> 5 -->
  <line x1="320" y1="580" x2="320" y2="612" stroke="#22d3ee" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrowCyan)">
    <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.1s" repeatCount="indefinite"/>
  </line>

  <!-- Step 5: Performance Evaluation -->
  <rect x="70" y="616" width="500" height="72" rx="12" fill="#1e293b" stroke="#22d3ee" stroke-width="1.8"/>
  <circle cx="96" cy="652" r="5" fill="#22d3ee" filter="url(#glow)">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="320" y="646" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">5. Performance Evaluation</text>
  <text x="320" y="671" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">Pd  •  Pfa  •  Pm  •  Accuracy  •  ROC-AUC</text>

  <!-- Flow 5 -> 6 -->
  <line x1="320" y1="688" x2="320" y2="720" stroke="#38bdf8" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrowBlue)">
    <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.1s" repeatCount="indefinite"/>
  </line>

  <!-- Step 6: Statistical Validation -->
  <rect x="70" y="724" width="500" height="70" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
  <circle cx="96" cy="759" r="5" fill="#38bdf8" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="320" y="753" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">6. Multi-Seed Statistical Validation</text>
  <text x="320" y="777" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">10 Stratified Splits  •  Mean ± Std  •  AWGN vs. Rayleigh Comparison</text>
</svg>
